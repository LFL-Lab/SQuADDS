name: Release Drafter

on:
  push:
    branches:
      - master
      - main
  pull_request:
    types: [closed]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  update_release_draft:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Run Release Drafter
        uses: release-drafter/release-drafter@v7
        with:
          config-name: release-drafter.yml
          dry-run: ${{ github.ref_name != 'master' && github.ref_name != 'main' }}  # a run from any other branch only previews the draft
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

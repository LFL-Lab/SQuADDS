name: CI/CD Pipeline for Cross-Platform Tests

on:
  push:
    branches:
      - master
      - main
    paths:
      - 'squadds/**'
      - 'squadds_mcp/**'
      - 'tests/**'
      - 'tutorials/**'
      - 'scripts/run_tutorials.py'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/test_build.yml'
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:
    inputs:
      os:
        description: 'Runner OS for the test matrix (all = Linux, macOS and Windows)'
        required: false
        default: all
        type: choice
        options:
          - all
          - ubuntu-latest
          - macos-latest
          - windows-latest

concurrency:
  # A newer push to the same pull request cancels the older run; pushes to master each finish.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    # Does this run touch code? Pull requests that change only docs, the README or other text skip the jobs below;
    # "CI result" still reports, so it can be the single required check in branch protection.
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "$BASE...$HEAD")"
          echo "Changed files:"
          echo "$changed"
          if echo "$changed" | grep -qE '^(squadds/|squadds_mcp/|tests/|tutorials/|scripts/run_tutorials\.py$|pyproject\.toml$|uv\.lock$|\.github/workflows/test_build\.yml$)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: changes
    if: (github.event_name != 'pull_request' || needs.changes.outputs.code == 'true')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((inputs.os == '' || inputs.os == 'all') && '["ubuntu-latest", "macos-latest", "windows-latest"]' || format('["{0}"]', inputs.os)) }}
        python-version: ['3.11', '3.12', '3.13']
    env:
      MPLBACKEND: Agg
      QISKIT_METAL_HEADLESS: "1"
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      UV_PYTHON: ${{ matrix.python-version }}  # overrides .python-version so each cell tests its own Python

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0 libglu1-mesa

      - name: Install dependencies
        run: uv sync --extra dev --extra mcp --extra ml

      - name: Set up environment file
        run: |
          echo "HUGGINGFACE_API_KEY=${{ secrets.HUGGINGFACE_API_KEY }}" > .env
          if [ -n "$HF_TOKEN" ]; then echo "HF_TOKEN secret: present"; else echo "HF_TOKEN secret: absent (Hub model tests skip)"; fi
        shell: bash

      - name: Show what the Hugging Face token can read
        if: env.HF_TOKEN != ''
        run: |
          uv run python - <<'PY' || true
          from huggingface_hub import whoami
          w = whoami()
          a = w.get("auth", {}).get("accessToken", {})
          print("token owner:", w.get("name"), "| role:", a.get("role"))
          for s in (a.get("fineGrained") or {}).get("scoped", []):
              print("  scope:", s.get("entity", {}).get("type"), s.get("entity", {}).get("name"), s.get("permissions"))
          PY
        shell: bash

      - name: Run pytest
        run: |
          uv run python -c "import sys; print('Python', sys.version)"
          uv run pytest -q -m "not integration" --tb=short

  ml-integration:
    # The heavy ML checks (marker "integration"): both released models against the Space code on public layouts, the
    # substrate route, the Analyzer bridge, the planar dataset source, exact component rebuilds of dataset records and the
    # live hosted inference API. The training-reproduction gates need the training data and skip here.
    # Needs HF_TOKEN; pull requests from forks get no secrets, so they skip this job.
    needs: changes
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (github.event_name != 'pull_request' || needs.changes.outputs.code == 'true')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((inputs.os == '' || inputs.os == 'all') && '["ubuntu-latest", "macos-latest", "windows-latest"]' || format('["{0}"]', inputs.os)) }}
    env:
      MPLBACKEND: Agg
      QISKIT_METAL_HEADLESS: "1"
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      UV_PYTHON: "3.12"
      SQUADDS_REQUIRE_HUB_MODELS: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0 libglu1-mesa

      - name: Install dependencies
        run: uv sync --extra dev --extra mcp --extra ml --extra gds

      - name: Set up environment file
        run: |
          if [ -z "$HF_TOKEN" ]; then echo "::error::HF_TOKEN secret is missing; the ML integration tests need it"; exit 1; fi
          echo "HUGGINGFACE_API_KEY=${{ secrets.HUGGINGFACE_API_KEY }}" > .env
        shell: bash

      - name: Run ML integration tests
        run: uv run pytest -q -m integration --ignore=tests/mvp_test.py --tb=short -rs

  tutorials:
    # Runs Tutorials 11-15 top to bottom as a user would (pip extras [ml,gds], no Hugging Face token) and fails on any
    # cell error or failing shell line (scripts/run_tutorials.py). Cells tagged skip-ci need the all-data training shards
    # and hours of training (Tutorial 14's collective retrain). Tutorial 16 screens thousands of layouts with 8 worker
    # processes (about 8 min on an 18-core laptop) and is not run here.
    needs: changes
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (github.event_name != 'pull_request' || needs.changes.outputs.code == 'true')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((inputs.os == '' || inputs.os == 'all') && '["ubuntu-latest", "macos-latest", "windows-latest"]' || format('["{0}"]', inputs.os)) }}
    env:
      MPLBACKEND: Agg
      QISKIT_METAL_HEADLESS: "1"
      HF_HUB_DISABLE_IMPLICIT_TOKEN: "1"
      UV_PYTHON: "3.12"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0 libglu1-mesa

      - name: Install dependencies
        run: |
          uv sync --extra ml --extra gds
          uv pip install nbclient ipykernel
        shell: bash

      - name: Run Tutorials 11-15
        working-directory: tutorials
        run: >-
          uv run --no-sync python ../scripts/run_tutorials.py
          Tutorial-11_Predicting_Capacitance_Matrices_from_GDS.ipynb
          Tutorial-12_Planar_Capacitance_Families_in_SQuADDS.ipynb
          Tutorial-13_From_Layout_to_Hamiltonian_with_ML.ipynb
          Tutorial-14_Training_on_Your_Own_Designs.ipynb
          Tutorial-15_Contributing_Capacitance_Data_and_Models.ipynb
          --timeout 1800 --out ../executed_tutorials
        shell: bash

      - name: Upload the executed notebooks
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: executed-tutorials-${{ matrix.os }}
          path: executed_tutorials/
          if-no-files-found: ignore

  old-glibc-install:
    # A plain pip install of squadds[ml] on glibc 2.28 Linux (the RHEL / Rocky 8 class of many clusters), then QCap and
    # QCap-Fast predictions with the public models and no token. PySide6 >= 6.10 has no wheel below glibc 2.34, which is
    # why pyproject.toml asks for pyside6>=6.8.
    needs: changes
    if: (github.event_name != 'pull_request' || needs.changes.outputs.code == 'true')
    runs-on: ubuntu-latest
    container: quay.io/pypa/manylinux_2_28_x86_64
    defaults:
      run:
        shell: bash
    env:
      MPLBACKEND: Agg
      QISKIT_METAL_HEADLESS: "1"
      HF_HUB_DISABLE_IMPLICIT_TOKEN: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install with pip
        run: |
          ldd --version | sed -n 1p  # sed reads to the end: head would SIGPIPE ldd under pipefail
          /opt/python/cp312-cp312/bin/python -m venv /tmp/venv
          /tmp/venv/bin/python -m pip install --upgrade pip
          /tmp/venv/bin/python -m pip install ".[ml]"
          /tmp/venv/bin/python -m pip list | grep -i -E "^(pyside6|torch|shapely|squadds) "

      - name: Import and predict
        run: |
          /tmp/venv/bin/python -c "import squadds, squadds.ml.capacitance; print('squadds', squadds.__version__)"
          /tmp/venv/bin/squadds-ml predict tests/data/capml/parity/exp13_q3d_cap_0414.gds
          /tmp/venv/bin/squadds-ml predict tests/data/capml/parity/exp13_q3d_cap_0414.gds --model QCap-Fast

  integration-smoke:
    # The SQuADDS MVP calls and the QCap user contract (tests/mvp_test.py) on every OS, with the [ml] extra.
    needs: changes
    if: (github.event_name != 'pull_request' || needs.changes.outputs.code == 'true')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((inputs.os == '' || inputs.os == 'all') && '["ubuntu-latest", "macos-latest", "windows-latest"]' || format('["{0}"]', inputs.os)) }}
    env:
      MPLBACKEND: Agg
      QISKIT_METAL_HEADLESS: "1"
      SQUADDS_RUN_LIVE_TESTS: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0 libglu1-mesa

      - name: Install dependencies
        run: uv sync --extra dev --extra mcp --extra ml

      - name: Set up environment file
        run: |
          echo "HUGGINGFACE_API_KEY=${{ secrets.HUGGINGFACE_API_KEY }}" > .env
        shell: bash

      - name: Run MVP integration smoke tests
        run: uv run pytest -s -vv tests/mvp_test.py --tb=short -ra

  lint:
    needs: changes
    if: (github.event_name != 'pull_request' || needs.changes.outputs.code == 'true')
    runs-on: ubuntu-latest
    env:
      QISKIT_METAL_HEADLESS: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --extra dev --extra mcp

      - name: Run Ruff linter
        run: uv run ruff check .
        continue-on-error: true

      - name: Run Ruff formatter check
        run: uv run ruff format --check .
        continue-on-error: true

  ci-result:
    # The one check to require in branch protection: green when every job above passed, or was skipped because the
    # pull request changes no code (docs or README only) or comes from a fork without secrets.
    name: CI result
    if: always()
    needs: [changes, test, ml-integration, tutorials, old-glibc-install, integration-smoke, lint]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "At least one job failed or was cancelled."
          exit 1
      - name: Summary
        run: echo "All jobs passed, or were skipped because nothing they test changed."

name: Lint GitHub Actions

on:
  push:
    branches:
      - master
      - main
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
  pull_request:
    branches:
      - master
      - main
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
  workflow_dispatch:

permissions:
  contents: read
  checks: write

concurrency:
  # A newer push to the same pull request cancels the older run; pushes to master each finish.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  actionlint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Lint workflows
        uses: reviewdog/action-actionlint@v1
        with:
          fail_level: error
          reporter: github-check

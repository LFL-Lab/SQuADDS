{# Breadcrumbs as a quiet line of text above the title. #}
{% if title and pagename != root_doc %}
<nav aria-label="{{ _('Breadcrumb') }}" class="paper-crumbs d-print-none">
  <ol>
    <li><a href="{{ pathto(root_doc) }}">SQuADDS</a></li>
    {%- for doc in parents %}
    <li>{% if doc.link %}<a href="{{ doc.link|e }}">{{ doc.title }}</a>{% else %}{{ doc.title }}{% endif %}</li>
    {%- endfor %}
    <li aria-current="page">{{ title }}</li>
  </ol>
</nav>
{% endif %}

<style>
:root{
  color-scheme:light;
  --paper:#ffffff; --head:rgba(255,255,255,.95); --ink:#1b1a19; --ink-2:#4a4744; --ink-3:#6b6662; --rule:#e4e1dc; --hover:#f6f4f1;
  --accent:#990000; --on-accent:#ffffff; --accent-wash:#f8eaea; --frame-edge:#e4e1dc; --video-dim:none;
  --measure:46rem; --serif:"STIX Two Text","Times New Roman",Times,serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --paper:#151412; --head:rgba(21,20,18,.94); --ink:#ece8e2; --ink-2:#c4beb6; --ink-3:#9a938b; --rule:#2f2c29; --hover:#201e1b;
  --accent:#FFCC00; --on-accent:#1a1406; --accent-wash:rgba(255,204,0,.12); --frame-edge:#3a3632; --video-dim:brightness(.9);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#151412; --head:rgba(21,20,18,.94); --ink:#ece8e2; --ink-2:#c4beb6; --ink-3:#9a938b; --rule:#2f2c29; --hover:#201e1b;
  --accent:#FFCC00; --on-accent:#1a1406; --accent-wash:rgba(255,204,0,.12); --frame-edge:#3a3632; --video-dim:brightness(.9);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:4.5rem}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--paper);color:var(--ink);font:400 1.0625rem/1.55 var(--serif);font-variant-numeric:oldstyle-nums proportional-nums;-webkit-font-smoothing:antialiased;transition:background-color .25s,color .25s}
::selection{background:var(--accent);color:var(--on-accent)}
a{color:var(--accent);text-decoration-thickness:1px;text-underline-offset:.18em}
a:hover{text-decoration-thickness:2px}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:2px}
svg.ic{width:1em;height:1em;vertical-align:-.12em}

/* running head */
.runhead{position:sticky;top:0;z-index:10;background:var(--head);backdrop-filter:saturate(1.2) blur(6px);border-bottom:1px solid var(--rule)}
.runhead .in{max-width:76rem;margin:0 auto;padding:.5rem 1.25rem;display:flex;align-items:center;gap:1rem;font-size:.82rem;color:var(--ink-3)}
.runhead a.home{display:flex;align-items:center;gap:.45rem;color:var(--ink);text-decoration:none;font-weight:700;letter-spacing:.02em;font-size:.9rem;flex:none}
.runhead img{height:28px;width:28px;display:block}
.runhead img.dark{display:none}
:root[data-theme="dark"] .runhead img.light{display:none}:root[data-theme="dark"] .runhead img.dark{display:block}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .runhead img.light{display:none}:root:not([data-theme="light"]) .runhead img.dark{display:block}}
.runhead a.short{font-style:italic;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink-2);text-decoration:none;min-width:0}
.runhead a.short:hover{color:var(--accent);text-decoration:underline}
.runhead .pg{margin-left:auto;font-variant-numeric:lining-nums tabular-nums;white-space:nowrap}
@media (max-width:520px){.runhead .pg{display:none}.runhead a.short{margin-right:auto}}
.theme{flex:none;width:34px;height:34px;border-radius:50%;border:1px solid var(--rule);background:transparent;color:var(--ink-2);display:grid;place-items:center;cursor:pointer;padding:0}
.theme:hover{color:var(--accent);border-color:var(--accent)}
.theme svg{width:17px;height:17px}

.frame{max-width:76rem;margin:0 auto;padding:0 1.25rem;display:grid;grid-template-columns:15rem minmax(0,1fr);gap:3.5rem}
@media (max-width:1000px){.frame{grid-template-columns:1fr;gap:0}}

/* outline = PDF bookmarks */
nav.outline{position:sticky;top:3.6rem;align-self:start;padding:clamp(.6rem,3.2vh,2.6rem) 0 0;font-size:clamp(.72rem,1.55vh,.86rem);line-height:1.3}
/* always pinned, never its own scroll box: it shrinks with the window height instead; short windows fold the tutorial list */
@media (max-height:680px){nav.outline li.tutsub{display:none}}
nav.outline h2{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:var(--ink-3);margin:0 0 clamp(.3rem,1.4vh,.9rem)}
nav.outline ol{list-style:none;margin:0;padding:0}
nav.outline ol ol{padding-left:1.1rem;margin:clamp(0rem,.3vh,.2rem) 0 clamp(.05rem,.5vh,.35rem)}
nav.outline a{display:flex;gap:.45rem;padding:clamp(.06rem,.32vh,.2rem) 0;color:var(--ink-2);text-decoration:none}
nav.outline a:hover{color:var(--accent)}
nav.outline a .n{min-width:1.6rem;color:var(--ink-3);font-variant-numeric:lining-nums}
nav.outline a.novideo{color:var(--ink-3)}
nav.outline a .dot{margin-left:auto;flex:none;width:.42rem;height:.42rem;border-radius:50%;background:var(--accent);align-self:center}
nav.outline a .ext{margin-left:auto;flex:none;color:var(--ink-3);align-self:center}
nav.outline a.tl span:nth-child(2){white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
nav.outline a[aria-current="true"],nav.outline a[aria-current="true"] .n{color:var(--accent)}
nav.outline .key{margin-top:clamp(.4rem,2vh,1.4rem);color:var(--ink-3);font-size:.78rem;display:flex;align-items:center;gap:.45rem}
nav.outline .key .dot{width:.42rem;height:.42rem;border-radius:50%;background:var(--accent)}
details.mobile-outline{display:none}
@media (max-width:1000px){nav.outline{display:none}details.mobile-outline{display:block;border-bottom:1px solid var(--rule);padding:.8rem 0}
  details.mobile-outline summary{cursor:pointer;font-size:.9rem;color:var(--ink-2)}
  details.mobile-outline nav.outline{display:block;position:static;max-height:none;padding:.8rem 0 0}}

main{min-width:0;max-width:var(--measure);padding-bottom:6rem}

/* title block, revtex-like */
header.titleblock{text-align:center;padding:3.2rem 0 2.2rem;border-bottom:1px solid var(--rule)}
header.titleblock h1{font-size:clamp(1.45rem,1.05rem + 1.6vw,2.05rem);line-height:1.22;font-weight:700;margin:0 auto .9rem;max-width:40rem;text-wrap:balance;letter-spacing:-.005em}
.authors{font-variant:small-caps;letter-spacing:.03em;font-size:1.06rem;margin:0}
.affil{font-style:italic;color:var(--ink-2);font-size:.92rem;margin:.3rem 0 0}
.abstract{max-width:38rem;margin:2rem auto 0;text-align:justify;hyphens:auto;font-size:.97rem;line-height:1.5;font-variant-numeric:lining-nums}
.abstract p{margin:0;text-indent:1.5em}
.lede{max-width:34rem;margin:1.6rem auto 0;color:var(--ink-2);font-size:.95rem;font-style:italic;text-wrap:pretty}
.links{display:flex;flex-wrap:wrap;justify-content:center;gap:.45rem 1.3rem;margin:1.3rem auto 0;max-width:38rem;font-size:.92rem}
.links a{white-space:nowrap}
.links .sep{color:var(--ink-3)}

/* sections */
section.sec{padding-top:3.2rem}
h2.sec{font-size:.98rem;font-weight:700;letter-spacing:.11em;text-transform:uppercase;text-align:center;margin:0 0 1.5rem}
h3.sub{font-size:1.02rem;font-weight:700;text-align:center;margin:2.6rem 0 1.2rem}
h4.subsub{font-size:1rem;font-weight:600;font-style:italic;margin:2.2rem 0 1rem}
.nov{color:var(--ink-3);font-style:italic;font-size:.95rem;text-align:center;margin:.2rem 0}
.see{font-size:.9rem;color:var(--ink-2);margin:.9rem 0 0}

/* video as figure */
figure.vid{margin:0}
figure.vid .pl{--pl-ink:var(--ink);--pl-muted:var(--ink-3);--pl-track:var(--rule);--pl-accent:var(--accent);--pl-edge:var(--frame-edge)}
figure.vid .pl-video{filter:var(--video-dim)}
figure.vid .pl-big{color:var(--on-accent)}
figcaption{margin-top:.6rem;font-size:.9rem;line-height:1.45;color:var(--ink)}
figcaption b{font-weight:700}
figcaption .meta{color:var(--ink-3);font-variant-numeric:lining-nums tabular-nums}
.chapters{display:flex;flex-wrap:wrap;gap:.35rem .5rem;margin:.7rem 0 0;padding:0;list-style:none}
.chapters button{font:inherit;font-size:.82rem;border:1px solid var(--rule);background:var(--paper);color:var(--ink-2);border-radius:999px;padding:.18rem .65rem;cursor:pointer;font-variant-numeric:lining-nums tabular-nums}
.chapters button:hover{border-color:var(--accent);color:var(--accent)}
.chapters button.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
details.script{margin-top:.6rem;font-size:.88rem}
details.script summary{cursor:pointer;color:var(--ink-2);list-style:none;display:inline-flex;align-items:center;gap:.35rem}
details.script summary::-webkit-details-marker{display:none}
details.script summary::before{content:"";width:.45rem;height:.45rem;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(-45deg);transition:transform .2s}
details.script[open] summary::before{transform:rotate(45deg)}
ol.beats{columns:2;column-gap:2rem;list-style:none;margin:.7rem 0 0;padding:0}
@media (max-width:640px){ol.beats{columns:1}}
ol.beats li{break-inside:avoid}
ol.beats button{all:unset;cursor:pointer;display:grid;grid-template-columns:2.4rem 1fr;gap:.3rem;padding:.22rem .3rem;border-radius:3px;line-height:1.35;width:100%;box-sizing:border-box}
ol.beats button:hover{background:var(--hover)}
ol.beats button:focus-visible{outline:2px solid var(--accent)}
ol.beats .t{color:var(--ink-3);font-variant-numeric:lining-nums tabular-nums}
ol.beats button.now{background:var(--accent-wash)}
ol.beats button.now .t{color:var(--accent)}

/* tutorials */
ol.tutorials{list-style:none;margin:0;padding:0;border-top:1px solid var(--rule)}
ol.tutorials a{display:grid;grid-template-columns:6.2rem 1fr auto;gap:.8rem;align-items:baseline;padding:.7rem .2rem;border-bottom:1px solid var(--rule);color:var(--ink);text-decoration:none}
ol.tutorials a:hover{background:var(--hover)}
ol.tutorials a:hover .tt{color:var(--accent);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:.18em}
ol.tutorials .tn{font-variant:small-caps;letter-spacing:.04em;color:var(--ink-3);font-variant-numeric:lining-nums}
ol.tutorials .ext{color:var(--ink-3)}
@media (max-width:520px){ol.tutorials a{grid-template-columns:1fr auto}ol.tutorials .tn{grid-column:1/-1}}

footer{border-top:1px solid var(--rule);margin-top:4rem;padding-top:1.4rem;font-size:.86rem;color:var(--ink-3)}
footer p{margin:0 0 .45rem}
footer .credit{color:var(--ink-2)}
footer a{color:inherit}
footer a:hover{color:var(--accent)}
.titleblock .mark{display:block;width:auto;height:72px;margin:0 auto 1.1rem}
.titleblock .mark.dark{display:none}
:root[data-theme="dark"] .titleblock .mark.light{display:none}:root[data-theme="dark"] .titleblock .mark.dark{display:block}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .titleblock .mark.light{display:none}:root:not([data-theme="light"]) .titleblock .mark.dark{display:block}}
@media (max-width:640px){.titleblock .mark{height:56px}}
</style>
</head>
<body>
<div class="runhead"><div class="in">
  <a class="home" href="#" id="home" aria-label="SQuADDS documentation"><img class="light" src="media/squadds_logo_transparent.png" alt=""><img class="dark" src="media/squadds_logo_dark.png" alt=""><span>SQuADDS</span></a>
  <a class="short" id="pdf-head" href="#" title="The paper (PDF)">Shanto, Das &amp; Levenson-Falk · QCap: a physics-corrected graph neural network …</a>
  <span class="pg" id="pg"></span>
  <button class="theme" id="theme" type="button"></button>
</div></div>

<div class="frame">
  <nav class="outline" id="outline" aria-label="Paper outline"></nav>
  <main>
    <header class="titleblock">
      <img class="mark light" src="media/qcap_light.svg" alt="QCap" width="140" height="72"><img class="mark dark" src="media/qcap_dark.svg" alt="QCap" width="140" height="72">
      <h1 id="title"></h1>
      <p class="authors" id="authors"></p>
      <p class="affil" id="affil"></p>
      <div class="abstract" id="abstract" role="doc-abstract"></div>
      <p class="lede">Every section of the paper that has a video shows it here, in the paper's order, under the paper's headings. The videos are silent. Each caption list is the text that appears on screen.</p>
      <div class="links" id="links"></div>
    </header>
    <details class="mobile-outline"><summary>Contents</summary><div id="outline-m"></div></details>
    <div id="body"></div>
    <footer id="foot"></footer>
  </main>
</div>

<script>
const L = PAPER.links, V = Object.fromEntries(VIDEOS.map(v => [v.id, v]));
const EXT = '<svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3.5H3.5v9h9V10M9 3.5h3.5V7M12.5 3.5 7 9" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const total = VIDEOS.reduce((a, v) => a + v.duration, 0);
document.getElementById("title").textContent = PAPER.title;
document.getElementById("authors").textContent = PAPER.authors.join(", ");
document.getElementById("affil").textContent = PAPER.lab;
document.getElementById("abstract").innerHTML = `<p>${PAPER.abstract}</p>`;
document.getElementById("pg").textContent = `${VIDEOS.length} videos · ${fmt(total)}`;
document.getElementById("home").href = L.home;
document.getElementById("pdf-head").href = L.paper_pdf;
document.getElementById("links").innerHTML = [
  ["Paper", L.paper_pdf], ["Dataset on Hugging Face", L.dataset], ["Models on Hugging Face", L.models],
  ["Browser demo (Hugging Face Space)", L.space], ["SQuADDS ML inference API", L.api], ["SQuADDS on GitHub", L.github],
].map(([t, h]) => `<a href="${h}">${t}</a>`).join("");
document.getElementById("foot").innerHTML = `<p class="credit">Videos, tutorials and page by <a href="https://sadmanahmedshanto.com">Sadman Ahmed Shanto</a>.</p>
  <p class="copyright">© Copyright 2026, <a href="https://sadmanahmedshanto.com">Sadman Ahmed Shanto</a> &amp; Eli Levenson-Falk.</p>`;

// light / dark toggle (follows the system until the reader picks one)
const themeBtn = document.getElementById("theme"), root = document.documentElement;
const SUN = '<svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="3.6" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M10 1.8v2.1M10 16.1v2.1M1.8 10h2.1M16.1 10h2.1M4.2 4.2l1.5 1.5M14.3 14.3l1.5 1.5M4.2 15.8l1.5-1.5M14.3 5.7l1.5-1.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>';
const MOON = '<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M16.6 12.6A7 7 0 0 1 7.4 3.4a7 7 0 1 0 9.2 9.2Z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>';
const isDark = () => root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
const paintToggle = () => { const d = isDark(); themeBtn.innerHTML = d ? SUN : MOON; themeBtn.setAttribute("aria-label", d ? "Switch to light mode" : "Switch to dark mode"); themeBtn.title = themeBtn.getAttribute("aria-label"); };
themeBtn.onclick = () => { const t = isDark() ? "light" : "dark"; root.dataset.theme = t; try { localStorage.setItem("theme", t); } catch (e) {} paintToggle(); };
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", paintToggle);
paintToggle();

function figure(ref, path) {
  const [id, at] = ref.split("@"), v = V[id], start = at ? +at : 0;
  const fig = document.createElement("figure"); fig.className = "vid"; fig.id = at ? `${id}-from-${Math.round(start)}` : id;
  const chapters = v.chapters.length ? `<ul class="chapters">${v.chapters.map(c => `<li><button data-t="${c.t}">${fmt(c.t)} ${c.text}</button></li>`).join("")}</ul>` : "";
  const pl = player(v, { start });
  fig.innerHTML = `
    <figcaption><b>Video ${v.n}.</b> ${v.title}${at ? `, from ${fmt(start)}` : ""}. ${v.line}
      <span class="meta">${fmt(v.duration)}.</span>
      <span>Paper: §${path}${v.labels.some(l => l.startsWith("app:")) ? " and its appendix" : ""}.</span>
      ${chapters}
      <details class="script"><summary>On-screen captions (${v.beats.length})</summary>
        <ol class="beats">${v.beats.map(b => `<li><button data-t="${b.t}"><span class="t">${fmt(b.t)}</span><span>${b.html}</span></button></li>`).join("")}</ol>
      </details>
    </figcaption>`;
  fig.prepend(pl.el);
  const beatBtns = [...fig.querySelectorAll("ol.beats button")], chapBtns = [...fig.querySelectorAll(".chapters button")];
  [...beatBtns, ...chapBtns].forEach(b => b.addEventListener("click", () => pl.seek(+b.dataset.t)));
  const mark = (list, t, cls) => { let k = -1; list.forEach((b, i) => { if (+b.dataset.t <= t + 0.05) k = i; }); list.forEach((b, i) => b.classList.toggle(cls, i === k)); };
  pl.onTime(t => { mark(beatBtns, t, "now"); mark(chapBtns, t, "on"); });
  fig._pl = pl;
  return fig;
}
const T = Object.fromEntries(PAPER.tutorials.map(t => [t.num, t]));
const body = document.getElementById("body"), outline = [];
function build(s, depth, prefix, parent) {
  const path = depth === 0 ? s.num : `${prefix} ${s.num}`, vids = s.videos || [];
  const el = depth === 0 ? Object.assign(document.createElement("section"), { className: "sec" }) : document.createElement("div");
  const h = document.createElement(["h2", "h3", "h4"][depth]); h.className = ["sec", "sub", "subsub"][depth];
  h.id = s.label.replace(":", "-"); h.textContent = `${s.num}. ${s.title}`; el.appendChild(h);
  outline.push({ depth, num: `${s.num}.`, title: s.title, href: `#${h.id}`, id: h.id, video: vids.length > 0 });
  vids.forEach(r => el.appendChild(figure(r, path)));
  if (s.see) el.insertAdjacentHTML("beforeend", `<p class="see">Worked examples: ${s.see.map(k => `<a href="${T[k].href}">Tutorial ${k}, ${T[k].title}</a>`).join(" and ")}.</p>`);
  if (!vids.length && !s.subs) el.insertAdjacentHTML("beforeend", `<p class="nov">No video for this section. Read §${path} in the paper.</p>`);
  (s.subs || []).forEach(x => build(x, depth + 1, path, el));
  parent.appendChild(el);
}
PAPER.outline.forEach(s => build(s, 0, "", body));

// tutorials: the SQuADDS notebooks that go with the paper
const tut = document.createElement("section"); tut.className = "sec";
tut.innerHTML = `<h2 class="sec" id="tutorials">Tutorials</h2>
  <ol class="tutorials">${PAPER.tutorials.map(t => `<li><a href="${t.href}"><span class="tn">Tutorial ${t.num}</span><span class="tt">${t.title}</span><span class="ext">${EXT}</span></a></li>`).join("")}</ol>`;
body.appendChild(tut);
outline.push({ depth: 0, num: "", title: "Tutorials", href: "#tutorials", id: "tutorials", video: false, tut: true });
PAPER.tutorials.forEach(t => outline.push({ depth: 1, num: `${t.num}.`, title: t.title, href: t.href, ext: true, cls: "tl" }));

function outlineHTML() {
  let html = `<h2>Outline</h2><ol>`, d = 0;
  outline.forEach(o => {
    while (o.depth > d) { html += "<ol>"; d++; }
    while (o.depth < d) { html += "</ol>"; d--; }
    const mark = o.video ? '<span class="dot" aria-label="has a video"></span>' : o.ext ? `<span class="ext" aria-label="opens the tutorial">${EXT}</span>` : "";
    html += `<li${o.ext ? ' class="tutsub"' : ""}><a href="${o.href}" class="${o.video || o.ext || o.tut ? "" : "novideo"} ${o.cls || ""}"${o.id ? ` data-id="${o.id}"` : ""}${o.ext ? ` title="Tutorial ${o.num.replace(".", "")}: ${o.title}"` : ""}><span class="n">${o.num}</span><span>${o.title}</span>${mark}</a></li>`;
  });
  while (d-- > 0) html += "</ol>";
  return html + `</ol><p class="key"><span class="dot"></span> has a video</p>`;
}
document.getElementById("outline").innerHTML = outlineHTML();
document.getElementById("outline-m").innerHTML = `<nav class="outline">${outlineHTML()}</nav>`;

// outline follows the reader
const links = [...document.querySelectorAll("#outline a[data-id]")];
const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) links.forEach(a => a.setAttribute("aria-current", a.dataset.id === e.target.id)); }), { rootMargin: "-20% 0px -70% 0px" });
outline.filter(o => o.id).forEach(o => io.observe(document.getElementById(o.id)));
